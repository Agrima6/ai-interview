version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: workmateiq-mongodb-local
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - workmateiq-network

  redis:
    image: redis:7.0-alpine
    container_name: workmateiq-redis-local
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - workmateiq-network

  rabbitmq:
    image: rabbitmq:3.11-management-alpine
    container_name: workmateiq-rabbitmq-local
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - workmateiq-network

volumes:
  mongodb_data:
  redis_data:
  rabbitmq_data:

networks:
  workmateiq-network:
    driver: bridge
